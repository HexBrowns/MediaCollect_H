[package]
name = "media-collect-h"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["HexBrowns"]
description = "MediaCollect_H - プロジェクトが参照する素材を 1 つのフォルダに集め、パスを書き換えた別名の .aup2 を書き出す AviUtl2 プラグイン"
publish = false

[lib]
name = "media_collect_h"
crate-type = ["cdylib", "rlib"]

[dependencies]
aviutl2 = { version = "0.48", features = ["generic"] }
aviutl2-eframe = "0.48"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# フォルダを選ぶダイアログ・空き容量・ファイルの日時（BackupDiff_H の dialog.rs と同じ）
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
